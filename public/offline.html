<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#386641">
  <title>Sin conexión | Knowya</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background-color: #F2E8CC;
      color: #222C24;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .offline-container {
      max-width: 450px;
      padding: 2.5rem;
      background-color: #FFFFFF;
      border-radius: 20px;
    }

    .offline-icon {
      width: 100px;
      height: 100px;
      margin-bottom: 1.5rem;
    }

    h1 {
      color: #386641;
      margin-bottom: 1rem;
    }

    p {
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    button {
      background-color: #386641;
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      padding: 0.8rem 1.5rem;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
    }

    button:hover {
      background-color: #6A994E;
    }
  </style>
</head>

<body>
  <main class="offline-container">
    <img src="/icons/icon-192.png" alt="Knowya" class="offline-icon" />

    <h1>No hay conexión</h1>

    <p>
      Parece que no tienes conexión a Internet en este momento.
      Comprueba tu conexión e inténtalo de nuevo.
    </p>

    <button onclick="window.location.href = '/'">
      Reintentar
    </button>
  </main>
</body>

</html>
